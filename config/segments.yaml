# Market segments for the first scan (decision D3: 3–5 segments).
# Each query runs against every enabled source. Keep the list short:
# Stack Exchange allows ~300 unauthenticated requests per day.
#
# Query style: a phrase people use when they have an unmet need
# ("is there a tool", "alternative to", "too expensive") plus a segment term.

pain_phrases:
  - "is there a tool"
  - "alternative to"
  - "too expensive"
  - "looking for a"

segments:
  cloud-security:
    description: Cloud posture, misconfiguration, IAM sprawl, cloud cost of security tooling.
    terms: [CSPM, "cloud misconfiguration", "AWS IAM", "kubernetes security"]

  appsec-supply-chain:
    description: Secrets in code, dependency risk, SBOM, CI/CD pipeline security.
    terms: ["secrets scanning", SBOM, "dependency vulnerability", "CI pipeline security"]

  identity-access:
    description: SSO, MFA rollout, access reviews, privileged access, offboarding.
    # Round 2 (2026-11-22): "access review" matched game reviews and code review, and
    # "privileged access" matched breach news; replaced with unambiguous terms.
    terms: ["user access review", "privileged access management", "SSO tax",
            "employee offboarding", "SCIM provisioning"]

  smb-security-ops:
    description: Small teams with no SOC — alert overload, affordable detection, compliance.
    terms: ["small business security", SIEM, "EDR for small", "SOC 2 compliance tool"]
