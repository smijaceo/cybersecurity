# Iteration-2 shortlist (decision D21, PM 2026-11-23). Each opening becomes three competing
# concept variants (D19). theme_ids refer to reports/phase2/themes.json (iteration-2 run).
# Iteration-1 shortlist and concepts: ideas/iteration1/ and git history.

openings:
  - id: msp-windows-detection
    priority: 1
    theme_ids: [4, 16, 33]
    thesis: >-
      Windows detection and logging done for small businesses through the MSPs that already run
      their IT: per-server logon and user-activity auditing, detection-aware reduction of the
      log noise that makes SIEMs unaffordable, and low-false-positive file-share ransomware
      canaries with guided restore. Researchers on all three gaps independently named the same
      wedge: cheap, done-for-you, sold via MSPs. Builds directly on the founder's WEF/Sysmon
      detection work.

  - id: smb-compliance-reporting
    priority: 2
    theme_ids: [50, 12]
    thesis: >-
      A self-serve, low-cost regulatory incident-reporting clock and done-for-you security
      program for small and mid-size firms facing NIS2 ("important entities"), the FTC
      Safeguards Rule and SEC rules for small firms, likely sold through MSSPs and MSPs. The
      only gap rated crowdedness 2/3, and a compliance-driven market of the kind the backtest
      shows the method can find.

  - id: ai-agent-access-control
    priority: 3
    theme_ids: [10, 0]
    thesis: >-
      Policy enforcement and audit for AI agents' tool calls and MCP access — cheap,
      cross-agent, including headless/CI agent runs — for small and mid-size development teams
      below enterprise contracts. Crowded and fast-bundling (funded gateways, identity
      incumbents, cloud providers); demand comes almost entirely from developers. A deliberate
      bet on a fast-moving market.
